name: CI-Workflow             # Anzeigename in der GitHub-UI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:                           # Job-Name (Key)
    runs-on: ubuntu-latest          # Runner (VM-Image)
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4   # Action ausführen

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:                       # Action Parameter
          node-version: '>=24.0.0'
          cache: 'npm'

      - name: ci starten
        run: npm ci                 # Shell-Befehl

      - name: typecheck
        run: npx tsc --noEmit
      
      - name: linter starten
        run: npm run lint

      - name: Tests starten
        run: npm run test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:                       
          node-version: '>=24.0.0'
          cache: 'npm'

      - name: ci starten
        run: npm ci

      - name: playwright browser installieren
        run: npx playwright install --with-deps

      - name: playwright test starten
        run: npx playwright test

      - name: Test fehlgeschlagen
        if: failure()
        uses: actions/upload-artifact@v4
        with: 
          name: playwright-report
          path: playwright-report/
